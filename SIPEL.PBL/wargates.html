<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Warga - SipeL</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; }
    header { background: #28a745; color: white; padding: 15px; text-align: center; }
    .content { padding: 20px; }
    .calon {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <header>
    <h2>Dashboard Warga - SipeL</h2>
  </header>
  <div class="content">
    <h3>Selamat Datang, Warga!</h3>
    <p>Status: <b>Belum Memilih</b></p>

    <div class="calon">
      <h4>Calon RT 01 - Budi Santoso</h4>
      <p>Visi: RT yang transparan dan gotong royong.</p>
      <button>Pilih</button>
    </div>

    <div class="calon">
      <h4>Calon RT 02 - Siti Aminah</h4>
      <p>Visi: Lingkungan bersih, warga harmonis.</p>
      <button>Pilih</button>
    </div>
  </div>
</body>
</html>
