<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Voting App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="d-flex align-items-center" style="min-height:100vh; background:var(--bg);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="page-card p-4">
          <h3>Buat Akun</h3>
          <p class="text-muted">Isi data dengan benar untuk verifikasi.</p>
          <form id="registerForm" action="#" method="post" onsubmit="event.preventDefault(); alert('Registrasi simulated');">
            <div class="mb-3">
              <label class="form-label">Nama Lengkap</label>
              <input required type="text" class="form-control" id="fullName" placeholder="Nama lengkap">
            </div>
            <div class="mb-3 row">
              <div class="col">
                <label class="form-label">NIK / ID</label>
                <input required type="text" class="form-control" id="nik" placeholder="1234567890">
              </div>
              <div class="col">
                <label class="form-label">No. Telepon</label>
                <input required type="tel" class="form-control" id="phone" placeholder="08xxxxxxxx">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input required type="email" class="form-control" id="email" placeholder="nama@contoh.com">
            </div>
            <div class="mb-3 row">
              <div class="col">
                <label class="form-label">Password</label>
                <input required type="password" class="form-control" id="pass" placeholder="Minimal 6 karakter">
              </div>
              <div class="col">
                <label class="form-label">Konfirmasi Password</label>
                <input required type="password" class="form-control" id="pass2" placeholder="Ulangi password">
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <a href="login.html">Sudah punya akun? Login</a>
              <button class="btn btn-primary" type="submit">Daftar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
