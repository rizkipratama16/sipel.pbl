<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Datang | SipeL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: 
        linear-gradient(rgba(2, 132, 199, 0.45), rgba(15, 23, 42, 0.75)),
        url('DSC07670.jpg') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 40px 60px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 2.5rem;
      color: #E0F2FE;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      font-size: 1rem;
      color: #F1F5F9;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background-color: #0EA5E9;
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background-color: #0369A1;
      transform: translateY(-3px);
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: #E2E8F0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Selamat Datang di SipeL</h1>
    <p>Sistem Pemilihan RT/RW Online untuk lingkungan yang lebih transparan dan modern.</p>
    <a href="dashboard.html" class="btn">Masuk ke Dashboard</a>
  </div>

  <footer>© 2025 SipeL - Sistem Pemilihan Elektronik</footer>
</body>
</html>
