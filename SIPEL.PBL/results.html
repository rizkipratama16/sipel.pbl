<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hasil Voting - Voting App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Hasil Voting</h4>
    <a class="btn btn-outline-secondary btn-sm" href="dashboard.html">Kembali</a>
  </div>

  <div class="page-card p-3">
    <h6>Ringkasan Hasil</h6>
    <p class="small text-muted">Total suara: 1.234</p>

    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <div><strong>Rizki Santoso</strong></div>
        <div class="small text-muted">540</div>
      </div>
      <div class="progress" style="height:10px">
        <div class="progress-bar" role="progressbar" style="width:43.8%" aria-valuenow="43.8" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <div><strong>Siti Nurhayati</strong></div>
        <div class="small text-muted">420</div>
      </div>
      <div class="progress" style="height:10px">
        <div class="progress-bar" role="progressbar" style="width:34.0%" aria-valuenow="34.0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <div><strong>Budi Prasetyo</strong></div>
        <div class="small text-muted">274</div>
      </div>
      <div class="progress" style="height:10px">
        <div class="progress-bar" role="progressbar" style="width:22.2%" aria-valuenow="22.2" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
